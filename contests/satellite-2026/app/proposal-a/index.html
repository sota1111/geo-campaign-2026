<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>路面下リスクの二段階調査｜衛星で絞り、地中レーダで確かめる（実データ版。レーダ結果は利用者が入れる）</title>
<meta name="description" content="国土地理院の干渉SAR成果・OpenStreetMap の道路・豊中市の下水道台帳（いずれも実データ）で道路区間に点数を付け、地中レーダを投入する区間を選び、自治体が入れた調査結果（CSV）で重みを較正する流れの試作です。空洞の結果は同梱していません。">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map" aria-label="道路区間の地図（豊中市北東部）"></div>
<div id="badge" role="note">実データ（衛星・道路・台帳）／レーダ結果は未入力</div>
<div id="fake-mark" aria-hidden="true"><span>架空</span></div>
<details id="legend-box"><summary>凡例</summary><section id="legend" aria-label="凡例"></section></details>

<aside id="panel">
  <button id="sheet-toggle" type="button" aria-expanded="true" aria-controls="panel-body">▼ 地図を広く見る</button>
  <header id="head">
    <h1>路面下リスクの二段階調査<span class="round" id="round"></span></h1>
    <p class="sub">衛星で絞り、地中レーダ探査車（GMS3等）で確かめる</p>
    <p class="foot"><span id="status" role="note"></span><span class="note">衛星はだいち2号・4号で代用（主想定は Sentinel-1）</span><button id="btn-about" type="button">出典・限界</button></p>
    <div id="demo-banner" role="alert" hidden><span><b>架空</b>の結果で表示中（説明用デモ）</span><button id="demo-off" class="bannerbtn" type="button">デモをやめる</button></div>
  </header>
  <nav id="steps" role="tablist" aria-label="調査の段階">
    <button type="button" role="tab" id="tab-1" data-step="1" aria-selected="true"><b>1</b>絞る</button>
    <button type="button" role="tab" id="tab-2" data-step="2" aria-selected="false"><b>2</b>選ぶ</button>
    <button type="button" role="tab" id="tab-3" data-step="3" aria-selected="false"><b>3</b>戻す</button>
    <button type="button" role="tab" id="tab-4" data-step="4" aria-selected="false"><b>4</b>参考</button>
  </nav>
  <div id="panel-body">
    <section id="detail" aria-live="polite"></section>
    <section id="s1" class="step" aria-labelledby="tab-1"></section>
    <section id="s2" class="step" hidden aria-labelledby="tab-2"></section>
    <section id="s3" class="step" hidden aria-labelledby="tab-3"></section>
    <section id="s4" class="step" hidden aria-labelledby="tab-4"></section>
  </div>
</aside>

<div id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-box" tabindex="-1">
    <div class="modal-head"><h2 id="modal-title">出典・データの扱い・限界</h2><button id="btn-close2" type="button">閉じる</button></div>
    <div id="about-body"></div>
    <button id="btn-close" type="button">閉じる</button>
  </div>
</div>

<script src="vendor/maplibre-gl.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
